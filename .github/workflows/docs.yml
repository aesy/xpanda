---
name: Generate Documentation

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build landing page and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build documentation
        run: cargo doc --package xpanda --no-deps --all-features
      - name: Install landing page dependencies
        working-directory: site
        run: npm ci
      # The site is served from /xpanda/, so asset URLs need that prefix.
      - name: Build landing page
        working-directory: site
        run: npm run build -- --base=/xpanda/
      # The landing page is the site root and the crate docs live under /xpanda/docs/.
      # rustdoc writes no index page on stable, so /docs/ redirects to the crate.
      - name: Combine pages
        run: |
          mkdir -p pages/docs
          cp -r site/dist/. pages/
          cp -r target/doc/. pages/docs/
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=xpanda/"><link rel="canonical" href="xpanda/">' > pages/docs/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5